<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hit Clicker</title>
  <style>
    /* 连续点击时，不选中页面文字。 */
    html {
      -webkit-user-select: none;
      user-select: none;
    }
    #shop {
      border: 1px solid #ccc;
      padding: 16px;
      margin-top: 24px;
      max-width: 360px;
    }
    #shop-message {
      /* 购买结果由浮字显示；保留这份文字供屏幕阅读器读取。 */
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    /* 特效单独覆盖在页面上，不接收鼠标，也不产生滚动条。 */
    #hit-effects {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 10;
    }
    .hit-burst { position: absolute; inset: 0; }
    .hit-gain {
      position: absolute;
      color: #7541db;
      font: 800 32px/1 system-ui, sans-serif;
      z-index: 2;
      white-space: nowrap;
      text-shadow: 0 1px 3px white, 0 0 8px white;
    }
    .purchase-gain {
      font-size: 18px;
      line-height: 1.4;
      width: max-content;
      max-width: min(300px, calc(100vw - 24px));
      white-space: normal;
      text-align: center;
    }
    .hit-particle {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      z-index: 1;
    }
    .hit-ring {
      position: absolute;
      width: 24px;
      height: 24px;
      box-sizing: border-box;
      border: 3px solid;
      border-radius: 50%;
    }
    .volume-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 8px 12px 0 0;
    }
    #volume-slider { width: 140px; accent-color: #7541db; }
    #volume-value { min-width: 4ch; font-variant-numeric: tabular-nums; }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 16px;
      max-width: 520px;
      margin: 20px 0;
    }
    .stats p { margin: 0; }
    #helper-roster { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 36px; margin-top: 16px; }
    #helper-roster[data-paused="true"] { opacity: 0.45; }
    .helper-unit {
      position: relative;
      display: inline-block;
      width: 30px;
      height: 30px;
      background: #eee6ff;
      border: 2px solid #9360ef;
      border-radius: 11px;
    }
    .helper-unit::before {
      content: "";
      position: absolute;
      top: 9px;
      left: 7px;
      width: 4px;
      height: 5px;
      border-radius: 50%;
      background: #7541db;
      box-shadow: 11px 0 #7541db;
    }
    .helper-unit::after {
      content: "";
      position: absolute;
      top: 20px;
      left: 11px;
      width: 8px;
      height: 3px;
      background: #7541db;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <h1>Hit Clicker</h1>
  <p>鼠标左键单击商店和控制区以外的页面区域，积累 hit。</p>
  <div data-no-hit>
    <button id="sound-button" type="button" aria-pressed="true">声音：开（点击静音）</button>
    <button id="pause-button" type="button" aria-pressed="false">暂停游戏</button>
    <div class="volume-control">
      <label for="volume-slider">音量</label>
      <input id="volume-slider" type="range" min="0" max="100" step="1" value="50">
      <output id="volume-value" for="volume-slider">50%</output>
    </div>
    <span id="sound-status" role="status"></span>
    <p id="game-status" role="status">游戏进行中；切换到其他标签页时暂停，不累计后台收益。</p>
  </div>

  <div class="stats">
  <p>当前 hit：<strong id="balance">0</strong></p>
  <p>累计 hit：<strong id="total-hits">0</strong></p>
  <p>每次点击：+<strong id="per-click">1</strong> hit</p>
  <p>每秒自动收益：+<strong id="per-second">0</strong> hit</p>
  </div>

  <section id="shop" aria-labelledby="shop-title">
    <h2 id="shop-title">商店</h2>
    <p>点击强化 Lv.<strong id="upgrade-level">0</strong>：每购买一次，每次点击收益增加 1 hit。</p>
    <button id="upgrade-button" type="button">购买点击强化（10 hit）</button>
    <hr>
    <h3>自动小帮手（已拥有 <span id="helper-count">0</span>）</h3>
    <p>每个帮手每秒贡献 1 hit，不受点击强化影响。</p>
    <button id="helper-button" type="button">购买小帮手（50 hit）</button>
    <div id="helper-roster" aria-hidden="true">还没有小帮手。</div>
    <p id="helper-feedback">购买后，小帮手会在这里工作。</p>
    <p id="shop-message" role="status"></p>
  </section>
  <div id="hit-effects" aria-hidden="true"></div>

  <script>
    // 保存玩家当前拥有的 hit。
    let hits = 0;
    // 累计获得的 hit 不受消费影响，包含升级带来的额外收益。
    let totalHits = 0;
    let hitsPerClick = 1;
    let upgradeLevel = 0;
    let helperCount = 0;
    let helperTimer = null;
    let renderedHelperCount = 0;
    let isPaused = false;
    let purchaseEffect;

    // 找到页面上显示 hit 的数字。
    const balanceDisplay = document.querySelector("#balance");
    const totalHitsDisplay = document.querySelector("#total-hits");
    const perClickDisplay = document.querySelector("#per-click");
    const upgradeButton = document.querySelector("#upgrade-button");
    const upgradeLevelDisplay = document.querySelector("#upgrade-level");
    const shopMessage = document.querySelector("#shop-message");
    const hitEffects = document.querySelector("#hit-effects");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const soundButton = document.querySelector("#sound-button");
    const soundStatus = document.querySelector("#sound-status");
    const volumeSlider = document.querySelector("#volume-slider");
    const volumeValue = document.querySelector("#volume-value");
    const helperButton = document.querySelector("#helper-button");
    const helperCountDisplay = document.querySelector("#helper-count");
    const perSecondDisplay = document.querySelector("#per-second");
    const helperRoster = document.querySelector("#helper-roster");
    const helperFeedback = document.querySelector("#helper-feedback");
    const pauseButton = document.querySelector("#pause-button");
    const gameStatus = document.querySelector("#game-status");

    let soundEnabled = true;
    let soundVolume = 50;
    let audioContext;
    let masterGain;
    let noteIndex = -1;
    let lastSoundAt = -Infinity;
    let soundRequest = 0;
    const activeVoices = new Set();
    // 仍限定在 C、D、E、G、A 五个音中，但不再按固定顺序循环。
    const clickNotes = [523.25, 587.33, 659.25, 783.99, 880];

    function chooseClickNote(now) {
      if (noteIndex < 0 || now - lastSoundAt > 800) {
        // 停顿后从三个较低的音中随机重新开始。
        noteIndex = Math.floor(Math.random() * 3);
      } else {
        // 相邻音的权重更高，偶尔跨两个音，不连续重复同一个音。
        const candidates = [];
        for (let index = 0; index < clickNotes.length; index++) {
          const distance = Math.abs(index - noteIndex);
          const weight = distance === 1 ? 4 : distance === 2 ? 1 : 0;
          for (let count = 0; count < weight; count++) candidates.push(index);
        }
        noteIndex = candidates[Math.floor(Math.random() * candidates.length)];
      }
      lastSoundAt = now;
      return clickNotes[noteIndex];
    }

    function applyVolume() {
      if (!audioContext || !masterGain) return;
      const now = audioContext.currentTime;
      masterGain.gain.cancelScheduledValues(now);
      // 平滑调整总音量，避免拖动滑杆产生突兀的跳变。
      masterGain.gain.setTargetAtTime(soundEnabled ? 0.44 * soundVolume / 100 : 0, now, 0.015);
    }

    volumeSlider.addEventListener("input", () => {
      const value = Number(volumeSlider.value);
      soundVolume = Number.isFinite(value) ? Math.max(0, Math.min(100, value)) : 0;
      volumeValue.textContent = `${soundVolume}%`;
      applyVolume();
    });
    volumeSlider.addEventListener("change", () => {
      if (soundEnabled) void playSound("preview");
    });

    function updateSoundButton() {
      soundButton.textContent = soundEnabled ? "声音：开（点击静音）" : "声音：关（点击开启）";
      soundButton.setAttribute("aria-pressed", String(soundEnabled));
    }

    // 每个音只有约十分之一秒，开头和结尾渐变，减少生硬的爆音。
    function playTone(frequency, delay = 0, duration = 0.1, volume = 0.18) {
      if (activeVoices.size >= 12) return;
      const oscillator = audioContext.createOscillator();
      const envelope = audioContext.createGain();
      const start = audioContext.currentTime + delay;
      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(frequency, start);
      envelope.gain.setValueAtTime(0, start);
      envelope.gain.linearRampToValueAtTime(volume, start + 0.005);
      envelope.gain.exponentialRampToValueAtTime(0.001, start + duration);
      envelope.gain.linearRampToValueAtTime(0, start + duration + 0.01);
      oscillator.connect(envelope);
      envelope.connect(masterGain);
      activeVoices.add(oscillator);
      oscillator.onended = () => {
        activeVoices.delete(oscillator);
        oscillator.disconnect();
        envelope.disconnect();
      };
      oscillator.start(start);
      oscillator.stop(start + duration + 0.015);
    }

    // 只在用户操作后启动声音；声音不可用时，计数和购买仍然继续。
    async function playSound(kind) {
      if (!soundEnabled || soundVolume === 0) return;
      const request = ++soundRequest;
      try {
        if (!audioContext) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) throw new Error("Audio unavailable");
          audioContext = new AudioContextClass();
          masterGain = audioContext.createGain();
          masterGain.gain.value = 0.44 * soundVolume / 100;
          masterGain.connect(audioContext.destination);
        }
        if (audioContext.state !== "running") await audioContext.resume();
        // 等待浏览器恢复音频后只播放最新操作，避免积压的声音一齐响起。
        if (!soundEnabled || soundVolume === 0 || request !== soundRequest || audioContext.state !== "running") return;

        if (kind === "hit") {
          const now = performance.now();
          playTone(chooseClickNote(now));
        } else if (kind === "success") {
          // 购买成功使用短小的上行三音。
          [659.25, 783.99, 1046.5].forEach((note, index) => playTone(note, index * 0.065, 0.12, 0.16));
        } else if (kind === "error") {
          // 余额不足是较低、较轻的下行两音。
          playTone(196, 0, 0.09, 0.12);
          playTone(164.81, 0.07, 0.09, 0.1);
        } else {
          playTone(clickNotes[0]);
        }
      } catch {
        // 不让音频设备或浏览器限制中断游戏。
        if (!soundEnabled || request !== soundRequest) return;
        soundEnabled = false;
        updateSoundButton();
        soundStatus.textContent = "声音暂不可用，可以继续游戏或点击开关重试。";
      }
    }

    soundButton.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      soundRequest++;
      noteIndex = -1;
      lastSoundAt = -Infinity;
      soundStatus.textContent = "";
      updateSoundButton();
      applyVolume();
      if (!soundEnabled) {
        // 关闭时也停止已经排定的成功提示音。
        for (const oscillator of activeVoices) oscillator.stop(audioContext.currentTime + 0.012);
        activeVoices.clear();
      } else {
        void playSound("preview");
      }
    });

    // 收益和购买提示共用同一套浮字与粒子动画。
    function showFloatingEffect(x, y, text, kind = "hit") {
      // 限制同时存在的特效数量，快速连点也不会无限积累。
      while (hitEffects.children.length >= 12) {
        hitEffects.firstElementChild.remove();
      }
      const burst = document.createElement("div");
      burst.className = "hit-burst";
      hitEffects.append(burst);

      const gain = document.createElement("span");
      gain.className = kind === "hit" ? "hit-gain" : "hit-gain purchase-gain";
      gain.textContent = text;
      if (kind === "success") gain.style.color = "#18733b";
      if (kind === "error") gain.style.color = "#b3261e";
      if (kind === "auto") gain.style.color = "#188575";
      // 收益浮字在落点附近轻微随机偏移，同一点连点也有变化。
      const scatter = kind === "hit" && !reducedMotion.matches;
      const offsetX = scatter ? (Math.random() - 0.5) * 48 : 0;
      const offsetY = scatter ? (Math.random() - 0.5) * 32 : 0;
      const driftX = scatter ? (Math.random() - 0.5) * 36 : 0;
      if (scatter) gain.style.rotate = `${(Math.random() - 0.5) * 14}deg`;
      burst.append(gain);
      // 根据文字实际宽度调整边缘位置，购买提示也不会被裁切。
      const bounds = gain.getBoundingClientRect();
      const edge = bounds.width * 0.56 + 8;
      gain.style.left = `${Math.max(edge + Math.abs(driftX), Math.min(x + offsetX, window.innerWidth - edge - Math.abs(driftX)))}px`;
      gain.style.top = `${Math.max(bounds.height * 2.5 + 12, Math.min(y + offsetY, window.innerHeight - bounds.height))}px`;
      const gainAnimation = gain.animate(reducedMotion.matches ? [
        { opacity: 1, transform: "translate(-50%, -50%)" },
        { opacity: 0, transform: "translate(-50%, -50%)" }
      ] : [
        { opacity: 0, transform: "translate(-50%, -35%) scale(0.7)", offset: 0 },
        { opacity: 1, transform: "translate(-50%, -65%) scale(1.12)", offset: 0.15 },
        { opacity: 1, transform: "translate(-50%, -105%) scale(1)", offset: 0.4 },
        { opacity: 0, transform: `translate(calc(-50% + ${driftX}px), -250%) scale(0.95)`, offset: 1 }
      ], { duration: reducedMotion.matches ? 450 : 850, easing: "ease-out", fill: "forwards" });
      gainAnimation.onfinish = () => burst.remove();

      if (reducedMotion.matches || kind === "auto") return burst;
      const colors = kind === "success" ? ["#18733b", "#49bc7c", "#a4df80", "#f5c451"]
        : kind === "error" ? ["#b3261e", "#ed655a", "#ff957c", "#e65b85"]
        : ["#9360ef", "#ffac45", "#ff648e", "#39c6b4"];
      // 从真实点击位置扩散的圆环强化落点反馈。
      const ring = document.createElement("span");
      ring.className = "hit-ring";
      ring.style.left = `${x}px`;
      ring.style.top = `${y}px`;
      ring.style.borderColor = colors[0];
      burst.append(ring);
      ring.animate([
        { opacity: 0.85, transform: "translate(-50%, -50%) scale(0.35)" },
        { opacity: 0, transform: "translate(-50%, -50%) scale(4)" }
      ], { duration: 380, easing: "ease-out", fill: "forwards" });

      for (let i = 0; i < 14; i++) {
        const particle = document.createElement("span");
        particle.className = "hit-particle";
        particle.style.left = `${x}px`;
        particle.style.top = `${y}px`;
        particle.style.backgroundColor = colors[i % colors.length];
        const size = 7 + Math.random() * 6;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.borderRadius = i % 3 === 0 ? "2px" : "50%";
        burst.append(particle);
        const angle = (i / 14) * Math.PI * 2 + Math.random() * 0.25;
        const distance = 45 + Math.random() * 50;
        particle.animate([
          { opacity: 1, transform: "translate(-50%, -50%) scale(1)" },
          { opacity: 0, transform: `translate(calc(-50% + ${Math.cos(angle) * distance}px), calc(-50% + ${Math.sin(angle) * distance}px)) scale(0.15)` }
        ], { duration: 420 + Math.random() * 180, easing: "cubic-bezier(0, 0.6, 0.3, 1)", fill: "forwards" });
      }
      return burst;
    }

    // Lv.0 升 Lv.1 花费 10，之后每级增加 10。
    function getUpgradeCost() {
      return (upgradeLevel + 1) * 10;
    }

    function getHelperCost() {
      return (helperCount + 1) * 50;
    }

    function renderHelpers() {
      if (renderedHelperCount === helperCount) return;
      helperRoster.replaceChildren();
      for (let index = 0; index < Math.min(helperCount, 12); index++) {
        const helper = document.createElement("span");
        helper.className = "helper-unit";
        helperRoster.append(helper);
      }
      if (helperCount > 12) {
        const extra = document.createElement("span");
        extra.textContent = `另有 ${helperCount - 12} 个帮手`;
        helperRoster.append(extra);
      }
      renderedHelperCount = helperCount;
    }

    function runHelperTick() {
      if (isPaused || document.hidden || helperCount === 0) return;
      hits += helperCount;
      totalHits += helperCount;
      updateDisplay();
      helperFeedback.textContent = `刚刚贡献 +${helperCount} hit`;
      if (!reducedMotion.matches) {
        for (const helper of helperRoster.querySelectorAll(".helper-unit")) {
          helper.animate([
            { transform: "translateY(0) scale(1)" },
            { transform: "translateY(-7px) scale(1.08)" },
            { transform: "translateY(0) scale(1)" }
          ], { duration: 350, easing: "ease-out" });
        }
      }
      // 自动收益只给一条轻量浮字，不播放声音，避免每秒打扰玩家。
      const bounds = helperRoster.getBoundingClientRect();
      if (bounds.bottom > 0 && bounds.top < window.innerHeight) {
        showFloatingEffect(bounds.left + bounds.width / 2, bounds.top, `帮手 +${helperCount}`, "auto");
      }
    }

    function syncHelperTimer() {
      const shouldRun = helperCount > 0 && !isPaused && !document.hidden;
      if (!shouldRun && helperTimer !== null) {
        clearInterval(helperTimer);
        helperTimer = null;
      } else if (shouldRun && helperTimer === null) {
        helperTimer = setInterval(runHelperTick, 1000);
      }
    }

    function updateGameStatus() {
      pauseButton.textContent = isPaused ? "继续游戏" : "暂停游戏";
      pauseButton.setAttribute("aria-pressed", String(isPaused));
      gameStatus.textContent = isPaused
        ? "游戏已暂停：点击、购买和自动收益均已停止。"
        : document.hidden ? "页面暂不可见，自动收益已暂停。"
        : "游戏进行中；切换到其他标签页时暂停，不累计后台收益。";
      if (isPaused || document.hidden) helperFeedback.textContent = "小帮手已暂停工作。";
      else helperFeedback.textContent = helperCount > 0 ? "小帮手工作中，每秒结算一次。" : "购买后，小帮手会在这里工作。";
      syncHelperTimer();
      updateDisplay();
    }

    pauseButton.addEventListener("click", () => {
      isPaused = !isPaused;
      // 暂停时让仍在播放的提示音收尾静音。
      soundRequest++;
      for (const oscillator of activeVoices) oscillator.stop(audioContext.currentTime + 0.012);
      activeVoices.clear();
      hitEffects.replaceChildren();
      updateGameStatus();
    });
    document.addEventListener("visibilitychange", updateGameStatus);

    // 连续购买时只保留最新结果，避免长文字叠在一起。
    function showShopMessage(event, message, kind) {
      if (purchaseEffect) purchaseEffect.remove();
      shopMessage.textContent = message;
      // 键盘操作购买按钮时，特效从按钮中央出现。
      const buttonBounds = event.currentTarget.getBoundingClientRect();
      const x = event.detail === 0 ? buttonBounds.left + buttonBounds.width / 2 : event.clientX;
      const y = event.detail === 0 ? buttonBounds.top + buttonBounds.height / 2 : event.clientY;
      purchaseEffect = showFloatingEffect(x, y, message, kind);
      void playSound(kind);
    }

    // 余额和收益变化后，统一更新画面。
    function updateDisplay() {
      balanceDisplay.textContent = hits;
      totalHitsDisplay.textContent = totalHits;
      perClickDisplay.textContent = hitsPerClick;
      upgradeLevelDisplay.textContent = upgradeLevel;
      upgradeButton.textContent = `购买点击强化（${getUpgradeCost()} hit）`;
      helperCountDisplay.textContent = helperCount;
      perSecondDisplay.textContent = isPaused || document.hidden ? 0 : helperCount;
      helperButton.textContent = `购买小帮手（${getHelperCost()} hit）`;
      upgradeButton.disabled = isPaused;
      helperButton.disabled = isPaused;
      helperRoster.dataset.paused = String(isPaused || document.hidden);
      renderHelpers();
    }

    upgradeButton.addEventListener("click", (event) => {
      if (isPaused) return;
      const upgradeCost = getUpgradeCost();
      // 每次购买都检查当前余额，快速连续点击也不能透支。
      if (hits < upgradeCost) {
        showShopMessage(event, `余额不足 · 还差 ${upgradeCost - hits} hit`, "error");
        return;
      }

      hits = hits - upgradeCost;
      upgradeLevel = upgradeLevel + 1;
      hitsPerClick = hitsPerClick + 1;
      updateDisplay();
      showShopMessage(event, `购买成功 · Lv.${upgradeLevel}`, "success");
    });

    helperButton.addEventListener("click", (event) => {
      if (isPaused) return;
      const cost = getHelperCost();
      if (hits < cost) {
        showShopMessage(event, `余额不足 · 还差 ${cost - hits} hit`, "error");
        return;
      }
      hits -= cost;
      helperCount++;
      updateDisplay();
      helperFeedback.textContent = "小帮手工作中，每秒结算一次。";
      syncHelperTimer();
      showShopMessage(event, `购买成功 · 已有 ${helperCount} 个小帮手`, "success");
    });

    // 商店内的点击只操作商店；外面的左键点击才产生收益。
    document.addEventListener("click", (event) => {
      if (isPaused || document.hidden || event.button !== 0 || event.target.closest("#shop, [data-no-hit]")) {
        return;
      }

      hits = hits + hitsPerClick;
      totalHits = totalHits + hitsPerClick;
      updateDisplay();
      showFloatingEffect(event.clientX, event.clientY, `+${hitsPerClick}`);
      void playSound("hit");
    });
  </script>
</body>
</html>
