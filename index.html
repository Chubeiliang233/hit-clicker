<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hit Clicker</title>
  <style>
    /* 连续点击时，不选中页面文字。 */
    html {
      -webkit-user-select: none;
      user-select: none;
    }
    #shop {
      border: 1px solid #ccc;
      padding: 16px;
      margin-top: 24px;
      max-width: 360px;
    }
    #shop-message {
      /* 购买结果由浮字显示；保留这份文字供屏幕阅读器读取。 */
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    /* 特效单独覆盖在页面上，不接收鼠标，也不产生滚动条。 */
    #hit-effects {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 10;
    }
    .hit-burst { position: absolute; inset: 0; }
    .hit-gain {
      position: absolute;
      color: #7541db;
      font: 800 28px/1 system-ui, sans-serif;
      white-space: nowrap;
      text-shadow: 0 1px 3px white, 0 0 8px white;
    }
    .purchase-gain {
      font-size: 18px;
      line-height: 1.4;
      width: max-content;
      max-width: min(300px, calc(100vw - 24px));
      white-space: normal;
      text-align: center;
    }
    .hit-particle {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <h1>Hit Clicker</h1>
  <p>鼠标左键单击商店以外的页面区域，积累 hit。</p>

  <p>当前 hit：<strong id="balance">0</strong></p>
  <p>累计 hit：<strong id="total-hits">0</strong></p>
  <p>每次点击：+<strong id="per-click">1</strong> hit</p>

  <section id="shop" aria-labelledby="shop-title">
    <h2 id="shop-title">商店</h2>
    <p>点击强化 Lv.<strong id="upgrade-level">0</strong>：每购买一次，每次点击收益增加 1 hit。</p>
    <button id="upgrade-button" type="button">购买点击强化（10 hit）</button>
    <p id="shop-message" role="status"></p>
  </section>
  <div id="hit-effects" aria-hidden="true"></div>

  <script>
    // 保存玩家当前拥有的 hit。
    let hits = 0;
    // 累计获得的 hit 不受消费影响，包含升级带来的额外收益。
    let totalHits = 0;
    let hitsPerClick = 1;
    let upgradeLevel = 0;
    let purchaseEffect;

    // 找到页面上显示 hit 的数字。
    const balanceDisplay = document.querySelector("#balance");
    const totalHitsDisplay = document.querySelector("#total-hits");
    const perClickDisplay = document.querySelector("#per-click");
    const upgradeButton = document.querySelector("#upgrade-button");
    const upgradeLevelDisplay = document.querySelector("#upgrade-level");
    const shopMessage = document.querySelector("#shop-message");
    const hitEffects = document.querySelector("#hit-effects");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    // 收益和购买提示共用同一套浮字与粒子动画。
    function showFloatingEffect(x, y, text, kind = "hit") {
      // 限制同时存在的特效数量，快速连点也不会无限积累。
      while (hitEffects.children.length >= 12) {
        hitEffects.firstElementChild.remove();
      }
      const burst = document.createElement("div");
      burst.className = "hit-burst";
      hitEffects.append(burst);

      const gain = document.createElement("span");
      gain.className = kind === "hit" ? "hit-gain" : "hit-gain purchase-gain";
      gain.textContent = text;
      if (kind === "success") gain.style.color = "#18733b";
      if (kind === "error") gain.style.color = "#b3261e";
      burst.append(gain);
      // 根据文字实际宽度调整边缘位置，购买提示也不会被裁切。
      const bounds = gain.getBoundingClientRect();
      const edge = bounds.width * 0.56 + 8;
      gain.style.left = `${Math.max(edge, Math.min(x, window.innerWidth - edge))}px`;
      gain.style.top = `${Math.max(bounds.height * 2.2 + 12, Math.min(y, window.innerHeight - 24))}px`;
      const gainAnimation = gain.animate(reducedMotion.matches ? [
        { opacity: 1, transform: "translate(-50%, -50%)" },
        { opacity: 0, transform: "translate(-50%, -50%)" }
      ] : [
        { opacity: 0, transform: "translate(-50%, -35%) scale(0.7)", offset: 0 },
        { opacity: 1, transform: "translate(-50%, -65%) scale(1.12)", offset: 0.15 },
        { opacity: 1, transform: "translate(-50%, -105%) scale(1)", offset: 0.4 },
        { opacity: 0, transform: "translate(-50%, -220%) scale(0.95)", offset: 1 }
      ], { duration: reducedMotion.matches ? 450 : 850, easing: "ease-out", fill: "forwards" });
      gainAnimation.onfinish = () => burst.remove();

      if (reducedMotion.matches) return burst;
      const colors = kind === "success" ? ["#18733b", "#49bc7c", "#a4df80", "#f5c451"]
        : kind === "error" ? ["#b3261e", "#ed655a", "#ff957c", "#e65b85"]
        : ["#9360ef", "#ffac45", "#ff648e", "#39c6b4"];
      for (let i = 0; i < 8; i++) {
        const particle = document.createElement("span");
        particle.className = "hit-particle";
        particle.style.left = `${x}px`;
        particle.style.top = `${y}px`;
        particle.style.backgroundColor = colors[i % colors.length];
        burst.append(particle);
        const angle = (i / 8) * Math.PI * 2 + Math.random() * 0.25;
        const distance = 25 + Math.random() * 35;
        particle.animate([
          { opacity: 1, transform: "translate(-50%, -50%) scale(1)" },
          { opacity: 0, transform: `translate(calc(-50% + ${Math.cos(angle) * distance}px), calc(-50% + ${Math.sin(angle) * distance}px)) scale(0.15)` }
        ], { duration: 420 + Math.random() * 180, easing: "cubic-bezier(0, 0.6, 0.3, 1)", fill: "forwards" });
      }
      return burst;
    }

    // Lv.0 升 Lv.1 花费 10，之后每级增加 10。
    function getUpgradeCost() {
      return (upgradeLevel + 1) * 10;
    }

    // 连续购买时只保留最新结果，避免长文字叠在一起。
    function showShopMessage(event, message, kind) {
      if (purchaseEffect) purchaseEffect.remove();
      shopMessage.textContent = message;
      // 键盘操作购买按钮时，特效从按钮中央出现。
      const buttonBounds = upgradeButton.getBoundingClientRect();
      const x = event.detail === 0 ? buttonBounds.left + buttonBounds.width / 2 : event.clientX;
      const y = event.detail === 0 ? buttonBounds.top + buttonBounds.height / 2 : event.clientY;
      purchaseEffect = showFloatingEffect(x, y, message, kind);
    }

    // 余额和收益变化后，统一更新画面。
    function updateDisplay() {
      balanceDisplay.textContent = hits;
      totalHitsDisplay.textContent = totalHits;
      perClickDisplay.textContent = hitsPerClick;
      upgradeLevelDisplay.textContent = upgradeLevel;
      upgradeButton.textContent = `购买点击强化（${getUpgradeCost()} hit）`;
    }

    upgradeButton.addEventListener("click", (event) => {
      const upgradeCost = getUpgradeCost();
      // 每次购买都检查当前余额，快速连续点击也不能透支。
      if (hits < upgradeCost) {
        showShopMessage(event, `余额不足 · 还差 ${upgradeCost - hits} hit`, "error");
        return;
      }

      hits = hits - upgradeCost;
      upgradeLevel = upgradeLevel + 1;
      hitsPerClick = hitsPerClick + 1;
      updateDisplay();
      showShopMessage(event, `购买成功 · Lv.${upgradeLevel}`, "success");
    });

    // 商店内的点击只操作商店；外面的左键点击才产生收益。
    document.addEventListener("click", (event) => {
      if (event.button !== 0 || event.target.closest("#shop")) {
        return;
      }

      hits = hits + hitsPerClick;
      totalHits = totalHits + hitsPerClick;
      updateDisplay();
      showFloatingEffect(event.clientX, event.clientY, `+${hitsPerClick}`);
    });
  </script>
</body>
</html>
